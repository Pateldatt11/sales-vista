name: salesvista
description: "SalesVista - Modern Offline Sales Management System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 🔹 Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 🔹 Charts (⬅ downgraded)
  fl_chart: ^0.66.2

  # 🔹 File paths (Android/Desktop)
  path_provider: ^2.1.2

  # 🔹 UUID for IDs
  uuid: ^4.4.0

  # 🔹 Intl (⬅ downgraded)
  intl: ^0.19.0

  pdf: ^3.11.3
  printing: ^5.10.5
  
  # 🔹 Fonts (⬅ downgraded)
  google_fonts: ^6.1.0

  url_launcher: ^6.1.10
  
  # 🔹 Icons (⬅ downgraded)
  font_awesome_flutter: ^10.4.0

  image_picker: ^1.0.7

  provider: ^6.0.5

  # 🔹 CSV (⬅ downgraded)
  csv: ^5.0.2

  universal_html: ^2.2.4
  flutter_image_compress: ^2.3.0

  animations: ^2.0.11

  # 🔹 Routing (⬅ downgraded)
  go_router: ^13.2.0

  macos_dock: ^1.0.4
  
  # 🔹 Excel (⬅ downgraded)
  excel: ^2.1.0
  archive: ^3.6.1
  
  # 🔹 Permissions (⬅ downgraded)
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # 🔹 Hive Code Generator
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/maps/india_gst_state_code_map_vectorized.svg
    - assets/maps/india_gst_state_code_map_exact_embedded.svg
    - assets/maps/india_state_heatmap_tagged.svg
  # No bundled font files are required.